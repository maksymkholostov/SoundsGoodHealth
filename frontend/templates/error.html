{% extends "base.html" %}

{% block title %}Error | SoundsGood{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-body text-center p-5">
                    <i class="bi bi-exclamation-triangle text-warning display-1 mb-4"></i>
                    <h2 class="mb-4">Something Went Wrong</h2>
                    
                    {% if error %}
                    <div class="alert alert-danger">
                        {{ error }}
                    </div>
                    {% else %}
                    <div class="alert alert-danger">
                        An unexpected error occurred. Please try again or contact support if the problem persists.
                    </div>
                    {% endif %}
                    
                    <div class="mt-4">
                        <a href="{{ url_for('web_routes.index') }}" class="btn btn-primary me-2">
                            <i class="bi bi-house-door me-1"></i> Go to Home
                        </a>
                        <button class="btn btn-outline-secondary" onclick="window.history.back();">
                            <i class="bi bi-arrow-left me-1"></i> Go Back
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
