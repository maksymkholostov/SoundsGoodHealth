<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <!-- Background -->
  <rect x="0" y="0" width="500" height="400" fill="#f8f9fa" rx="10" ry="10"/>
  
  <!-- Title -->
  <text x="250" y="40" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#333">Speech Games</text>
  
  <!-- Game 1: Sound Catchers -->
  <g transform="translate(120, 120)">
    <!-- Game Card -->
    <rect x="-60" y="-40" width="120" height="160" fill="white" stroke="#F761A1" stroke-width="3" rx="10" ry="10" class="game-card"/>
    
    <!-- Game Title -->
    <text x="0" y="-15" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#F761A1">Sound Catchers</text>
    
    <!-- Game Visual -->
    <circle cx="0" cy="30" r="30" fill="#F761A1" class="game-icon"/>
    <path d="M-15,20 Q0,40 15,20" stroke="white" stroke-width="3" fill="none"/>
    <circle cx="-10" cy="20" r="4" fill="white"/>
    <circle cx="10" cy="20" r="4" fill="white"/>
    
    <!-- Game Description -->
    <text x="0" y="80" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">Catch falling sounds</text>
    <text x="0" y="95" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">by saying them</text>
  </g>
  
  <!-- Game 2: Word Builder -->
  <g transform="translate(250, 120)">
    <!-- Game Card -->
    <rect x="-60" y="-40" width="120" height="160" fill="white" stroke="#8C1BAB" stroke-width="3" rx="10" ry="10" class="game-card"/>
    
    <!-- Game Title -->
    <text x="0" y="-15" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#8C1BAB">Word Builder</text>
    
    <!-- Game Visual -->
    <rect x="-25" y="10" width="20" height="20" fill="#8C1BAB" class="game-block"/>
    <rect x="-25" y="35" width="20" height="20" fill="#8C1BAB" class="game-block"/>
    <rect x="0" y="35" width="20" height="20" fill="#8C1BAB" class="game-block"/>
    <rect x="0" y="10" width="20" height="20" fill="#8C1BAB" class="game-block"/>
    <text x="-15" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">A</text>
    <text x="-15" y="50" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">C</text>
    <text x="10" y="50" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">T</text>
    <text x="10" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">A</text>
    
    <!-- Game Description -->
    <text x="0" y="80" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">Build words with</text>
    <text x="0" y="95" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">clear pronunciation</text>
  </g>
  
  <!-- Game 3: Sound Race -->
  <g transform="translate(380, 120)">
    <!-- Game Card -->
    <rect x="-60" y="-40" width="120" height="160" fill="white" stroke="#BC78EC" stroke-width="3" rx="10" ry="10" class="game-card"/>
    
    <!-- Game Title -->
    <text x="0" y="-15" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#BC78EC">Sound Race</text>
    
    <!-- Game Visual: Race Track -->
    <ellipse cx="0" cy="30" rx="40" ry="25" fill="none" stroke="#BC78EC" stroke-width="5"/>
    
    <!-- Race Cars -->
    <g transform="translate(-20, 17)" class="race-car">
      <rect x="-8" y="-5" width="16" height="10" fill="#3B2667" rx="2" ry="2"/>
      <circle cx="-5" cy="5" r="3" fill="#333"/>
      <circle cx="5" cy="5" r="3" fill="#333"/>
    </g>
    
    <g transform="translate(20, 43)" class="race-car">
      <rect x="-8" y="-5" width="16" height="10" fill="#F761A1" rx="2" ry="2"/>
      <circle cx="-5" cy="5" r="3" fill="#333"/>
      <circle cx="5" cy="5" r="3" fill="#333"/>
    </g>
    
    <!-- Game Description -->
    <text x="0" y="80" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">Race by speaking</text>
    <text x="0" y="95" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#333">sounds correctly</text>
  </g>
  
  <!-- "Coming Soon" Banner -->
  <g transform="translate(250, 240)">
    <rect x="-120" y="-20" width="240" height="40" fill="#F761A1" rx="20" ry="20" class="coming-soon"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">Coming Soon!</text>
  </g>
  
  <!-- Decorative Elements -->
  <g class="decorative-elements">
    <!-- Sound Wave 1 -->
    <path d="M50,300 Q70,280 90,300 Q110,320 130,300" stroke="#F761A1" stroke-width="3" fill="none" class="decoration"/>
    
    <!-- Sound Wave 2 -->
    <path d="M380,300 Q400,280 420,300 Q440,320 460,300" stroke="#8C1BAB" stroke-width="3" fill="none" class="decoration"/>
    
    <!-- Star 1 -->
    <path d="M80,350 L85,340 L95,338 L87,330 L90,320 L80,325 L70,320 L73,330 L65,338 L75,340 Z" fill="#BC78EC" class="star"/>
    
    <!-- Star 2 -->
    <path d="M430,350 L435,340 L445,338 L437,330 L440,320 L430,325 L420,320 L423,330 L415,338 L425,340 Z" fill="#F761A1" class="star"/>
  </g>
  
  <!-- Animation -->
  <style>
    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0); }
    }
    
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    
    @keyframes race {
      0% { transform: rotate(0deg) translateX(30px) rotate(0deg); }
      100% { transform: rotate(360deg) translateX(30px) rotate(-360deg); }
    }
    
    @keyframes star-twinkle {
      0% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0.3; transform: scale(0.8); }
    }
    
    @keyframes wave {
      0% { transform: translateX(0); }
      50% { transform: translateX(10px); }
      100% { transform: translateX(0); }
    }
    
    .game-card {
      animation: pulse 4s infinite ease-in-out;
    }
    
    .game-icon {
      animation: pulse 2s infinite ease-in-out;
    }
    
    .game-block {
      animation: float 3s infinite ease-in-out;
      animation-delay: calc(var(--i) * 0.5s);
    }
    
    .game-block:nth-child(3) { --i: 0; }
    .game-block:nth-child(4) { --i: 1; }
    .game-block:nth-child(5) { --i: 2; }
    .game-block:nth-child(6) { --i: 3; }
    
    .race-car {
      animation: race 5s infinite linear;
    }
    
    .race-car:nth-child(1) { animation-duration: 4s; }
    .race-car:nth-child(2) { animation-duration: 5s; animation-direction: reverse; }
    
    .coming-soon {
      animation: pulse 2s infinite;
    }
    
    .star {
      animation: star-twinkle 3s infinite;
    }
    
    .star:nth-child(odd) { animation-delay: 1s; }
    
    .decoration {
      animation: wave 4s infinite ease-in-out;
    }
  </style>
</svg> 