<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <!-- Background -->
  <rect x="0" y="0" width="500" height="400" fill="#f8f9fa" rx="10" ry="10"/>
  
  <!-- Title -->
  <text x="250" y="40" font-family="Arial, sans-serif" font-size="24" text-anchor="middle" fill="#333">Verify Recordings</text>
  
  <!-- Sound Cards -->
  <g transform="translate(90, 80)">
    <!-- Sound Card 1 (Approved) -->
    <rect x="0" y="0" width="320" height="70" fill="white" stroke="#ddd" stroke-width="2" rx="8" ry="8" class="card"/>
    
    <!-- Play Icon -->
    <circle cx="35" cy="35" r="25" fill="#4CAF50"/>
    <polygon points="30,25 30,45 45,35" fill="white"/>
    
    <!-- Waveform -->
    <g transform="translate(80, 35)" class="waveform">
      <rect x="0" y="-5" width="3" height="10" fill="#4CAF50"/>
      <rect x="5" y="-10" width="3" height="20" fill="#4CAF50"/>
      <rect x="10" y="-15" width="3" height="30" fill="#4CAF50"/>
      <rect x="15" y="-8" width="3" height="16" fill="#4CAF50"/>
      <rect x="20" y="-20" width="3" height="40" fill="#4CAF50"/>
      <rect x="25" y="-12" width="3" height="24" fill="#4CAF50"/>
      <rect x="30" y="-8" width="3" height="16" fill="#4CAF50"/>
      <rect x="35" y="-15" width="3" height="30" fill="#4CAF50"/>
      <rect x="40" y="-7" width="3" height="14" fill="#4CAF50"/>
      <rect x="45" y="-10" width="3" height="20" fill="#4CAF50"/>
      <rect x="50" y="-5" width="3" height="10" fill="#4CAF50"/>
      <rect x="55" y="-8" width="3" height="16" fill="#4CAF50"/>
      <rect x="60" y="-12" width="3" height="24" fill="#4CAF50"/>
      <rect x="65" y="-5" width="3" height="10" fill="#4CAF50"/>
      <rect x="70" y="-7" width="3" height="14" fill="#4CAF50"/>
    </g>
    
    <!-- Sound Name -->
    <text x="170" y="35" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#333">Sound 1</text>
    
    <!-- Approved Mark -->
    <g transform="translate(270, 35)">
      <circle cx="0" cy="0" r="20" fill="#4CAF50"/>
      <polyline points="-8,0 -3,5 8,-8" stroke="white" stroke-width="3" fill="none" class="check"/>
    </g>
  </g>
  
  <g transform="translate(90, 160)">
    <!-- Sound Card 2 (Pending) -->
    <rect x="0" y="0" width="320" height="70" fill="white" stroke="#ddd" stroke-width="2" rx="8" ry="8" class="card"/>
    
    <!-- Play Icon -->
    <circle cx="35" cy="35" r="25" fill="#FF9800"/>
    <polygon points="30,25 30,45 45,35" fill="white"/>
    
    <!-- Waveform -->
    <g transform="translate(80, 35)" class="waveform">
      <rect x="0" y="-7" width="3" height="14" fill="#FF9800"/>
      <rect x="5" y="-12" width="3" height="24" fill="#FF9800"/>
      <rect x="10" y="-10" width="3" height="20" fill="#FF9800"/>
      <rect x="15" y="-15" width="3" height="30" fill="#FF9800"/>
      <rect x="20" y="-8" width="3" height="16" fill="#FF9800"/>
      <rect x="25" y="-18" width="3" height="36" fill="#FF9800"/>
      <rect x="30" y="-10" width="3" height="20" fill="#FF9800"/>
      <rect x="35" y="-5" width="3" height="10" fill="#FF9800"/>
      <rect x="40" y="-12" width="3" height="24" fill="#FF9800"/>
      <rect x="45" y="-8" width="3" height="16" fill="#FF9800"/>
      <rect x="50" y="-10" width="3" height="20" fill="#FF9800"/>
      <rect x="55" y="-15" width="3" height="30" fill="#FF9800"/>
      <rect x="60" y="-7" width="3" height="14" fill="#FF9800"/>
      <rect x="65" y="-12" width="3" height="24" fill="#FF9800"/>
      <rect x="70" y="-5" width="3" height="10" fill="#FF9800"/>
    </g>
    
    <!-- Sound Name -->
    <text x="170" y="35" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#333">Sound 2</text>
    
    <!-- Pending Mark -->
    <g transform="translate(270, 35)">
      <circle cx="0" cy="0" r="20" fill="#FF9800"/>
      <text x="0" y="5" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="white">?</text>
    </g>
  </g>
  
  <g transform="translate(90, 240)">
    <!-- Sound Card 3 (Rejected) -->
    <rect x="0" y="0" width="320" height="70" fill="white" stroke="#ddd" stroke-width="2" rx="8" ry="8" class="card"/>
    
    <!-- Play Icon -->
    <circle cx="35" cy="35" r="25" fill="#F44336"/>
    <polygon points="30,25 30,45 45,35" fill="white"/>
    
    <!-- Waveform -->
    <g transform="translate(80, 35)" class="waveform">
      <rect x="0" y="-5" width="3" height="10" fill="#F44336"/>
      <rect x="5" y="-20" width="3" height="40" fill="#F44336"/>
      <rect x="10" y="-7" width="3" height="14" fill="#F44336"/>
      <rect x="15" y="-5" width="3" height="10" fill="#F44336"/>
      <rect x="20" y="-25" width="3" height="50" fill="#F44336"/>
      <rect x="25" y="-8" width="3" height="16" fill="#F44336"/>
      <rect x="30" y="-15" width="3" height="30" fill="#F44336"/>
      <rect x="35" y="-5" width="3" height="10" fill="#F44336"/>
      <rect x="40" y="-23" width="3" height="46" fill="#F44336"/>
      <rect x="45" y="-7" width="3" height="14" fill="#F44336"/>
      <rect x="50" y="-5" width="3" height="10" fill="#F44336"/>
      <rect x="55" y="-18" width="3" height="36" fill="#F44336"/>
      <rect x="60" y="-10" width="3" height="20" fill="#F44336"/>
      <rect x="65" y="-5" width="3" height="10" fill="#F44336"/>
      <rect x="70" y="-12" width="3" height="24" fill="#F44336"/>
    </g>
    
    <!-- Sound Name -->
    <text x="170" y="35" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#333">Sound 3</text>
    
    <!-- Rejected Mark -->
    <g transform="translate(270, 35)">
      <circle cx="0" cy="0" r="20" fill="#F44336"/>
      <line x1="-8" y1="-8" x2="8" y2="8" stroke="white" stroke-width="3" class="x"/>
      <line x1="8" y1="-8" x2="-8" y2="8" stroke="white" stroke-width="3" class="x"/>
    </g>
  </g>
  
  <!-- Animation -->
  <style>
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    
    @keyframes check-draw {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    
    @keyframes x-draw {
      0% { stroke-dashoffset: 30; }
      100% { stroke-dashoffset: 0; }
    }
    
    .card {
      animation: pulse 3s infinite ease-in-out;
      animation-delay: calc(var(--i) * 0.5s);
    }
    
    .card:nth-child(1) { --i: 0; }
    .card:nth-child(2) { --i: 1; }
    .card:nth-child(3) { --i: 2; }
    
    .check {
      stroke-dasharray: 40;
      stroke-dashoffset: 40;
      animation: check-draw 1.5s forwards;
    }
    
    .x {
      stroke-dasharray: 30;
      stroke-dashoffset: 30;
      animation: x-draw 1.5s forwards;
    }
    
    @keyframes waveform-bounce {
      0% { transform: scaleY(1); }
      50% { transform: scaleY(1.1); }
      100% { transform: scaleY(1); }
    }
    
    .waveform rect {
      animation: waveform-bounce 2s infinite;
      transform-origin: bottom;
      animation-delay: calc(var(--i) * 0.1s);
    }
    
    .waveform rect:nth-child(odd) { --i: 1; }
    .waveform rect:nth-child(even) { --i: 2; }
  </style>
</svg> 