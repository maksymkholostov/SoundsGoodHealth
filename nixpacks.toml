[phases.setup]
aptPkgs = ["libsndfile1", "portaudio19-dev", "ffmpeg"]

[phases.install]
cmds = ["python -m venv --copies /opt/venv && . /opt/venv/bin/activate && pip install -r requirements.txt"]

[start]
cmd = "gunicorn wsgi:app"
onlyIncludeFiles = ["**/*.py", "requirements.txt", "Procfile", "start.sh"] 